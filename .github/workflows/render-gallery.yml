name: Browser render, device-safety QA and dashboard gallery
on:
  push:
    branches:
      - release/transparent-logo-and-ui-gallery
    paths-ignore:
      - 'docs/screenshots/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the proposed dashboard update
        uses: actions/checkout@v4
        with:
          ref: release/transparent-logo-and-ui-gallery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot test runner and real Material Design icons
        run: npm install --no-save --no-package-lock playwright @mdi/js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate release JavaScript syntax and existing unit tests
        run: |
          node --check dist/dreame-device-card.js
          node --test tests/test_device_card.cjs
      - name: Render newest card from dist and check safety across 12 screens
        run: node tests/render_demo_gallery.cjs
      - name: Commit approved synthetic-data screenshots on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m 'docs(gallery): capture latest Dreame dashboard browser rendering'
            git push origin HEAD:release/transparent-logo-and-ui-gallery
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dreame-current-dashboard-screenshots
          path: docs/screenshots/
          if-no-files-found: ignore