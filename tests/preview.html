<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreame card — synthetic HA UI test</title>
<style>
:root{color-scheme:light;--primary-text-color:#202a38;--secondary-text-color:#6c788c;--primary-color:#4378a9;--card-background-color:white;--ha-card-background:white;--secondary-background-color:#f1f4f8;--divider-color:#e0e6ee;--ha-card-border-color:#dfe6ee;--success-color:#298a50;--warning-color:#bb7c15;--error-color:#d33b3b;--state-active-color:#4378a9;--state-switch-active-color:#4378a9}
body.dark{color-scheme:dark;--primary-text-color:#f0f4f9;--secondary-text-color:#b1bdd0;--primary-color:#acd0f8;--card-background-color:#242e3b;--ha-card-background:#242e3b;--secondary-background-color:#354253;--divider-color:#4b586a;--ha-card-border-color:#485668;--success-color:#88d8a6;--warning-color:#f4c15b;--error-color:#ee8888;--state-active-color:#acd0f8;--state-switch-active-color:#acd0f8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f0f4f8;color:var(--primary-text-color)}body.dark{background:#172131}
.capture{max-width:500px;margin:auto;padding:15px 12px 20px}
.demo{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--secondary-text-color);margin:0 0 10px}.demo b{color:var(--primary-text-color)}.demo em{margin-left:auto;font-size:10px;font-style:normal}
.demo-dot{width:8px;height:8px;border-radius:50%;background:var(--success-color)}
ha-icon{display:inline-flex;align-items:center;justify-content:center;width:var(--mdc-icon-size,20px);height:var(--mdc-icon-size,20px);flex-shrink:0;vertical-align:middle}ha-icon svg{width:100%;height:100%;fill:currentColor}
</style>
<script>customElements.define('ha-icon',class extends HTMLElement{static get observedAttributes(){return ['icon']}connectedCallback(){this.draw()}attributeChangedCallback(){this.draw()}draw(){const k='mdi'+(this.getAttribute('icon')||'').replace(/^mdi:/,'').split('-').map(s=>s[0]?.toUpperCase()+s.slice(1)).join('');const p=window.__mdi?.[k]||window.__mdi?.mdiCircleSmall;if(p){this.style.display='inline-flex';this.style.width='var(--mdc-icon-size,20px)';this.style.height='var(--mdc-icon-size,20px)';this.innerHTML='<svg style="width:100%;height:100%;fill:currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="'+p+'"></path></svg>'}}})</script>
<script src="../dist/dreame-device-card.js"></script></head>
<body><main class="capture"><div class="demo"><i class="demo-dot"></i><b>Dreame Wet &amp; Dry Dashboard</b><em>SYNTHETIC DATA · ACTUAL CARD CODE</em></div><dreame-device-card id="card"></dreame-device-card></main>
<script>
(function(){
const p=new URLSearchParams(location.search),model=p.get('model')==='H14'?'H14':'H15',lang=p.get('lang')==='he'?'he':'en',dark=p.get('theme')!=='light';
document.body.classList.toggle('dark',dark);
const device={id:'demo',name:'Dreame '+(model==='H14'?'H14 Dual':'H15 Pro Heat'),model:model==='H14'?'dreame.hold.w2306e':'dreame.hold.w2449e',identifiers:[['dreame_wet_dry_vacuum','demo-cloud']]};
const roles=model==='H14'?H14_ROLES:ROLES;
const presets={battery:'86',work:'Sleeping',online:'on',charging:'off',clean_progress:'0',dry_progress:'0',clean_count:'27',runtime:'15',filter:'73',brush:'64',custom:'on',mode:'Personalized',suction:'Gentle',water:'Standard',hot_water:'Off',wash_mode:'Standard',dry_mode:'Quiet',volume:'1',schedule_time:'600',dirty_tank_status:'normal',warnings:'0',errors:'0',traction:'Auto',language:'English',arm:'Smart'};
const states={},entries=[];
for(const [role,[domain,suffix]] of Object.entries(roles)){
 if(role==="vacuum")continue; // The wet/dry stick integration does not expose a vacuum entity.
 const entity_id=domain+'.demo_'+role,options=role==='mode'?['Personalized','Smart','Quiet']:role==='hot_water'?['Off','On']:['Off','Auto','Standard','Quiet','High','Low','Smart','Personalized','English','Hebrew'];
 const value=presets[role] ?? (domain==='binary_sensor'?'off':domain==='switch'?'on':domain==='select'?'Auto':domain==='button'?'unknown':domain==='number'?'1':'0');
 const attributes={friendly_name:role,...(domain==='select'?{options}:{}),...(domain==='number'?{min:0,max:role==='schedule_time'?1439:role==='volume'?2:10,step:1}:{}),...(['battery','filter','brush','clean_progress','dry_progress'].includes(role)?{unit_of_measurement:'%'}:{}),...(['warnings','errors'].includes(role)?{raw_value:0}:{}),...(role==='work'&&model==='H15'?{raw_value:0}:{}),...(role==='mode'?{raw_value:4}:{}),...(role==='hot_water'?{raw_value:0}:{})};
 states[entity_id]={entity_id,state:value,attributes};
 entries.push({device_id:'demo',platform:'dreame_wet_dry_vacuum',entity_id,unique_id:'demo-cloud_'+suffix});
}
window.__calls=[];
const hass={states,language:lang,themes:{darkMode:dark},connection:{subscribeEvents:async()=>()=>{}},callWS:async msg=>msg.type==='config/device_registry/list'?[device]:msg.type==='config/entity_registry/list'?entries:[],callService:async(...args)=>window.__calls.push(args),formatEntityState:state=>state.state+(state.attributes?.unit_of_measurement?' '+state.attributes.unit_of_measurement:'')};
const card=document.querySelector('#card');card.setConfig({model,language:lang,title:model==='H14'?'H14 Dual':'H15 Pro Heat'});card.hass=hass;
window.__demo={card,hass,device,entries,states,lang,model,dark};
window.__ready=()=>card._resolved&&Boolean(card.shadowRoot?.querySelector('.metric-battery'))&&Boolean(card.shadowRoot?.querySelector('[role="tablist"]'));
})();
</script></body></html>
